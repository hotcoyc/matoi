[project]
name = "matoi"
version = "0.3.2"
description = "Matoi (纏) — CLI platform where AI agents work as a full startup team"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "ak" },
]
dependencies = [
    "anthropic>=0.52.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1.0",
    "python-dotenv>=1.0.0",
    "mempalace>=3.3.0",
    "prompt_toolkit>=3.0.0",
    "textual>=3.0.0",
    "questionary>=2.1.0",
    "alive-progress>=3.2.0",
    "pyfiglet>=1.0.0",
    "code-review-graph>=2.3.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]
viz = [
    "drawille>=0.2.0",
    "ascii-magic>=2.3.0",
]
graph = [
    "code-review-graph>=2.3.0",
]

[project.scripts]
matoi = "matoi.cli.app:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matoi"]

[tool.hatch.build.targets.wheel.force-include]
"agents" = "matoi/bundled_agents"
"assets" = "matoi/bundled_assets"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
